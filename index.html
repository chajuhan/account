<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:#ffffff;word-break:keep-all;color:#000000;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:8.5px;line-height:1.4;letter-spacing:-0.5px}
.box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;width:280px;min-height:100px;padding:36px;background:#ffffff;border:1px solid #000000;border-radius:0px}
a{color:#000000;text-decoration:underline}
mark{background:#e6e6e6;color:inherit;padding:0 2px}
.g{color:#8a8a8a}
sup{font-size:.75em;vertical-align:super;line-height:0}
html{-webkit-text-size-adjust:100%}
</style>
</head>
<body>
  <div class="box">
    <div style="text-align:left;margin-top:6px;width:calc(100%/0.96);transform:scaleX(0.96);transform-origin:left;margin-left:0;">@iustelle・20<sup>+</sup></div>
    <div style="text-align:left;margin-top:6px;width:calc(100%/0.96);transform:scaleX(0.96);transform-origin:left;margin-left:0;">백산 저 너희들은 변호됐다 <b>차주한</b><br>side of existence*</div>
    <div style="text-align:left;margin-top:6px;width:calc(100%/0.96);transform:scaleX(0.96);transform-origin:left;margin-left:0;">이입 온리 성향으로 동일한 배려 요합니다<br><b>차주한 드림러와 연결한 상태로 저와의 연결 발견 시 블락으로 대응</b><br>어떠한 것도 영향 받지 마시고 견제 및 사찰 등 불쾌한 행위 하지 마세요</div>
    <div style="text-align:left;margin-top:6px;width:calc(100%/0.96);transform:scaleX(0.96);transform-origin:left;margin-left:0;">블랙배저 전원, 데못죽 배세진, 순철논 프로이트 드림 받지 않습니다</div>
    <div style="text-align:right;margin-top:27px;width:calc(100%/0.96);transform:scaleX(0.96);transform-origin:right;margin-left:calc(100% - 100%/0.96);"><a href="https://reckressless.tistory.com" target="_blank" rel="noopener">back-up tistory</a></div>
  </div>
<script>
function fit(){var b=document.querySelector('.box');b.style.setProperty('--s',1);var s=Math.min(innerWidth*65/100/b.offsetWidth,innerHeight*65/100/b.offsetHeight,1.15);b.style.setProperty('--s',s)}
addEventListener('resize',fit);addEventListener('load',fit);fit();
if(document.fonts)document.fonts.ready.then(fit);
</script>
</body>
</html>
